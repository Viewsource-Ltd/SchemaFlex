name: Build & Publish SchemaFlex

on:
  push:
    branches:
      - main        # CI: test + sanity build on main
    tags:
      - 'v*'        # CD: full release pipeline on version tags
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest   # Linux runner required for Docker + Testcontainers
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Run tests
      run: dotnet test --configuration Release

  # Sanity build on every push to main - catches build breakage early without
  # producing anything, and without waiting for a tag.
  build-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Publish (win-x64, not uploaded)
      run: dotnet publish ./SchemaFlex/SchemaFlex.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/

  # Self-contained, single-file builds for every supported platform, each built
  # and smoke-tested on its own native OS. Only runs for tagged releases - if a
  # platform's binary doesn't actually run, this job (and so the release) fails.
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            bin: schemaflex.exe
          - rid: linux-x64
            os: ubuntu-latest
            bin: schemaflex
          # osx-x64 (Intel) is excluded for now - GitHub's macos-13 runner pool has
          # been taking 30+ minutes to queue a job, which isn't workable for a
          # release pipeline. Re-add it if that improves.
          - rid: osx-arm64
            os: macos-latest   # Apple Silicon runner
            bin: schemaflex
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Publish ${{ matrix.rid }}
      shell: bash
      run: |
        dotnet publish ./SchemaFlex/SchemaFlex.csproj -c Release -r ${{ matrix.rid }} \
          --self-contained \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true \
          -o publish/${{ matrix.rid }}

    - name: Smoke test the published binary
      shell: bash
      run: |
        cd publish/${{ matrix.rid }}
        chmod +x ./${{ matrix.bin }} || true
        ./${{ matrix.bin }} --version
        ./${{ matrix.bin }} --help
        ./${{ matrix.bin }} --connection "Data Source=:memory:" --output "$RUNNER_TEMP/smoke-test.html"
        test -s "$RUNNER_TEMP/smoke-test.html"

    # windows-latest has no `zip` on PATH, so Windows packages via PowerShell's
    # Compress-Archive instead; the other runners both have `zip` preinstalled.
    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: Compress-Archive -Path publish/${{ matrix.rid }}/${{ matrix.bin }} -DestinationPath schemaflex-${{ matrix.rid }}.zip

    - name: Package (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd publish/${{ matrix.rid }}
        zip -r ../../schemaflex-${{ matrix.rid }}.zip ${{ matrix.bin }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: schemaflex-${{ matrix.rid }}
        path: schemaflex-${{ matrix.rid }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: schemaflex-*
        path: dist
        merge-multiple: true

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: dist/*.zip

  # Redeploy the website once a release exists, so the "last updated" stamp
  # and the release-asset download links reflect the new version.
  deploy-site:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
