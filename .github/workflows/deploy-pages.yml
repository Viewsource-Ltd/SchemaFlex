name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - 'SchemaFlex.Web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Rebuilds SchemaFlex.Web/examples/sample-erd.html by actually running the CLI
      # against a small seeded SQLite database (SchemaFlex.Web/examples/sample-schema.sql),
      # rather than relying on someone to remember to regenerate the checked-in HTML file
      # by hand. This keeps the live example in sync with the erd.html template and the
      # generator on every deploy.
      - name: Regenerate the sample ERD example
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          sqlite3 "$RUNNER_TEMP/sample.db" < SchemaFlex.Web/examples/sample-schema.sql
          # SchemaFlex.csproj hardcodes a win-x64 self-contained RuntimeIdentifier
          # (for its own release publishing); override both here so this runs as an
          # ordinary framework-dependent build on whatever host OS this workflow runs on.
          dotnet run --project SchemaFlex -p:SelfContained=false -p:RuntimeIdentifier= -- --connection "Data Source=$RUNNER_TEMP/sample.db" --output SchemaFlex.Web/examples/sample-erd.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SchemaFlex.Web/package-lock.json

      - name: Install site build tooling
        run: npm ci
        working-directory: SchemaFlex.Web

      # Inlines css/site.css and js/*.js into the HTML and minifies everything, so
      # what's published is a couple of single-request pages, not four round trips.
      - name: Build optimized site
        run: npm run build
        working-directory: SchemaFlex.Web

      - name: Stamp last-updated placeholder
        run: |
          LAST_UPDATED=$(date -u '+%Y-%m-%d')
          YEAR=$(date -u '+%Y')
          find _site -name '*.html' -print0 | xargs -0 sed -i \
            -e "s/{{LAST_UPDATED}}/${LAST_UPDATED}/g" \
            -e "s/{{YEAR}}/${YEAR}/g"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
